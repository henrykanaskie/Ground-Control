<!-- ── header ──────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="upnav" id="upnav" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg>
    </a>
    <a class="brand" href="#/" aria-label="Ground Control — all projects">
      <svg class="icon brand-eye" aria-hidden="true"><use href="#i-eye"></use></svg>
      <span class="brand-word">GROUND_CONTROL</span>
    </a>

    <div class="topbar-meta">
      <span class="root-path mono" id="root-path" title="Scanned root"></span>
      <span class="counts" id="hdr-counts"></span>
    </div>

    <div class="topbar-actions">
      <span class="live" id="live" data-state="connecting">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-label" id="live-label">connecting</span>
      </span>
      <!-- Workbench: quick switcher (CONTRACT-WORKBENCH.md §5) -->
      <button class="btn btn-ghost wb-jump" id="wb-jump" type="button" title="Jump to a project (Cmd+K)">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <span>Jump</span>
        <kbd class="wb-kbd">⌘K</kbd>
      </button>
      <button class="btn" id="rescan" type="button" title="Rescan the root directory">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
        <span>Rescan</span>
      </button>
    </div>
  </div>
</header>

<!-- ── non-fatal error banner ──────────────────────────────────────────── -->
<div class="banner" id="banner" role="status" hidden>
  <div class="wrap banner-in">
    <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg>
    <span id="banner-text"></span>
    <button class="btn btn-ghost btn-sm" id="banner-retry" type="button">Retry now</button>
  </div>
</div>

<main id="main" class="wrap">

  <!-- ── grid view ─────────────────────────────────────────────────────── -->
  <section id="view-grid" class="view" aria-label="All projects">

    <form class="controls" id="controls" role="search" autocomplete="off">
      <div class="field field-search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="f-q" type="search" placeholder="Filter by name, stack, or description" aria-label="Filter projects">
      </div>

      <div class="chips" id="f-status" role="group" aria-label="Filter by status"></div>

      <!-- Workbench: agent filter chip (CONTRACT-WORKBENCH.md §5) -->
      <div class="chips" id="wb-chips" role="group" aria-label="Filter by agent activity"></div>

      <div class="field field-select">
        <label class="vh" for="f-stack">Filter by stack</label>
        <select id="f-stack"><option value="">All stacks</option></select>
      </div>

      <div class="field field-select">
        <label class="vh" for="f-sort">Sort</label>
        <select id="f-sort">
          <option value="activity">Last activity</option>
          <option value="name">Name</option>
          <option value="size">Size</option>
          <option value="commits">Commits</option>
          <!-- Workbench §5 -->
          <option value="agent">Agent activity</option>
        </select>
      </div>

      <button class="btn btn-ghost btn-sm" id="f-clear" type="button" hidden>Clear</button>
    </form>

    <p class="result-line" id="result-line"></p>

    <!-- Reclaim: the one quiet affordance in the grid (CONTRACT-RECLAIM.md §6).
         Filled in by app.js; individual cards never get a delete control. -->
    <div id="rc-slot"></div>

    <div class="grid" id="grid"></div>
    <div class="grid" id="skeletons" aria-hidden="true"></div>

    <div class="blank" id="grid-empty" hidden>
      <svg class="icon blank-icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <h2>Nothing matches</h2>
      <p id="grid-empty-text">No project matches the current filters.</p>
      <button class="btn" id="grid-empty-clear" type="button">Clear filters</button>
    </div>
  </section>

  <!-- ── detail view ───────────────────────────────────────────────────── -->
  <section id="view-detail" class="view" aria-label="Project detail" hidden></section>

  <!-- ── reader view ───────────────────────────────────────────────────── -->
  <section id="view-reader" class="view" aria-label="Document reader" hidden></section>

  <!-- ── reclaim view (CONTRACT-RECLAIM.md §6) ─────────────────────────── -->
  <section id="view-reclaim" class="view" aria-label="Reclaim dead folders" hidden></section>

</main>

<footer class="foot wrap">
  <span class="mono" id="foot-scan"></span>
</footer>

<div id="announcer" class="vh" aria-live="polite" aria-atomic="true"></div>

<noscript>
  <div class="wrap" style="padding:40px 0"><p>Ground Control needs JavaScript enabled.</p></div>
</noscript>

</body>
</html>
